# =============================================================================
# Sen / Zen Profile — Headless Agent Work Mode
# =============================================================================
description="Sen: headless, max compile perf, zero UI"

CPU_GOVERNOR="performance"
GPU_POWER_PROFILE="1"          # 3D_FULL_SCREEN (good for compile too)
GPU_PERF_LEVEL="high"
GPU_POWER_LIMIT=$(cat /sys/class/drm/card*/device/hwmon/hwmon5/power1_cap_max 2>/dev/null | head -1 || echo "0")
SCHED_MIGRATION_COST="500000"
SCHED_MIN_GRANULARITY="2000000"
SCHED_WAKEUP_GRANULARITY="1500000"
VM_DIRTY_RATIO="5"
VM_DIRTY_BG_RATIO="2"
AUDIO_POWER_SAVE="0"
MONITOR_REFRESH="144"
MONITOR_MODE="1920x1080@144Hz,0x0,1"

# Sen-specific
SEN_KILL_PROCESSES="brave firefox chromium thunderbird eww waybar dunst"
SEN_SUSPEND_PROCESSES="blueman-applet blueman-tray"
SEN_STOP_SERVICES="waybar.service"
SEN_DISABLE_EFFECTS="true"
