name: Generate Manifest

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/manifest-generator.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate manifest
        run: python3 scripts/manifest-generator.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain _registry/manifest.yaml)" ]; then
            git add _registry/manifest.yaml
            git commit -m "chore: auto-regenerate manifest.yaml [skip ci]"
            git push
          else
            echo "No manifest changes to commit."
          fi
